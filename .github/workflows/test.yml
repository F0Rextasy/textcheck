name: test

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: published bench must stay correct
        run: python bench/bench.py
      - name: clean fixture must pass
        run: python scripts/textcheck fixtures/utf8-clean
      - name: mess fixture must fail the gate
        run: |
          python scripts/textcheck fixtures/windows-mess || test $? -eq 1
          python scripts/textcheck fixtures/crlf-bom --bom-policy strict || test $? -eq 1
